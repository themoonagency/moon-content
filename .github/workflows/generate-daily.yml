name: Moon Content - Generare zilnică

on:
  schedule:
    # 08:00 România (ora de vară, UTC+3) = 05:00 UTC. Ajustează dacă e nevoie.
    - cron: "0 5 * * *"
  workflow_dispatch: {}  # permite rulare manuală din tab-ul Actions

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generează ciorna și trimite spre aprobare
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_IG_ID: ${{ secrets.META_IG_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python generate_draft.py

      - name: Salvează starea (ciorne + imagine temporară)
        run: |
          git config user.name "moon-content-bot"
          git config user.email "moon-content-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || git commit -m "Ciornă nouă $(date -u +%F)"
          git push
