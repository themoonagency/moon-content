name: MOON Post - Generare

on:
  # mp15: cronul GitHub OPRIT (18 sept 2026) - motorul ruleaza in workerul moon-post.
  # Fluxul rmane doar ca rezerva, pornit din panou prin workflow_dispatch.
  workflow_dispatch:
    inputs:
      client_id:
        description: "ID de client (gol = toți cei scadenți acum)"
        required: false
        type: string
      forteaza:
        description: "Ignoră programul și generează oricum (da/nu)"
        required: false
        default: "nu"
        type: string
      draft_id:
        description: "Doar imaginile unei ciorne scrise de motorul din worker (mp12)"
        required: false
        type: string

# O singura rulare de generare o data. Fara asta, cronul propriu, pasul din
# fluxul de publicare si pornirea din panou porneau trei rulari deodata, si
# fiecare genera (si platea) aceeasi postare.
concurrency:
  # un grup PE CLIENT: „Genereaza acum" apasat pe mai multi clienti ruleaza in paralel.
  # Cu un singur grup, GitHub tine un singur run in asteptare si le ANULA pe celelalte
  # („Canceling since a higher priority waiting request exists", 11 sept). Dublurile le opreste lesa gen-<client>-<slot> din panou.
  # imaginile unei ciorne au grupul ciornei: doua ciorne ale aceluiasi client nu se anuleaza intre ele
  group: moon-post-generare-${{ inputs.draft_id || inputs.client_id || 'programat' }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Toate cheile clienților vin din panou. În Secrets rămân doar cele două
      # ale panoului — nimic nu se mai comite înapoi în repo.
      - name: Generează ciornele scadente
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
          CLIENT_ID: ${{ inputs.client_id }}
          FORTEAZA: ${{ inputs.forteaza }}
          DRAFT_ID: ${{ inputs.draft_id }}
        run: python generate_draft.py
