name: MOON Post - Generare

on:
  schedule:
    # din oră în oră; panoul spune cine are postare scadentă acum
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      client_id:
        description: "ID de client (gol = toți cei scadenți acum)"
        required: false
        type: string
      forteaza:
        description: "Ignoră programul și generează oricum (da/nu)"
        required: false
        default: "nu"
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Toate cheile clienților vin din panou. În Secrets rămân doar cele două
      # ale panoului — nimic nu se mai comite înapoi în repo.
      - name: Generează ciornele scadente
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
          CLIENT_ID: ${{ inputs.client_id }}
          FORTEAZA: ${{ inputs.forteaza }}
        run: python generate_draft.py
