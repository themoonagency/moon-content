name: MOON Post - Publică ce s-a aprobat

on:
  schedule:
    - cron: "*/5 * * * *"   # repo public = minute Actions nelimitate
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Aprobarea se face în panou. Publicarea forțată nu mai are nevoie de un
      # input aici — se apasă „Aprobă" pe ciorna respectivă în panou.
      - name: Publică ciornele aprobate
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: python check_approvals.py

      # Generarea merge si de aici, tot la 5 minute. Cronul separat de generare
      # a stat 14 ore fara sa porneasca desi era pe „din ora in ora", iar fluxul
      # asta n-a ratat nicio rulare — deci nu ne mai bazam pe el.
      # Panoul spune cine e scadent si cine a fost apasat din buton; daca nu e
      # nimeni, pasul iese intr-o secunda.
      - name: Generează ce e scadent sau cerut din buton
        if: always()
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: python generate_draft.py
