name: MOON Post - Publică ce s-a aprobat

on:
  schedule:
    - cron: "*/5 * * * *"   # repo public = minute Actions nelimitate
  workflow_dispatch: {}

concurrency:
  group: moon-post-publicare
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Aprobarea se face în panou. Publicarea forțată nu mai are nevoie de un
      # input aici — se apasă „Aprobă" pe ciorna respectivă în panou.
      - name: Publică ciornele aprobate
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: python check_approvals.py

      # Aici luam DOAR clientii apasati din buton (DOAR_COADA=1). Generarea
      # dupa program are cronul ei; daca o faceam si aici, aceeasi postare se
      # genera de doua ori, o data din fiecare flux. Panoul mai are si o lesa
      # pe client, ca plasa de siguranta.
      - name: Pornește ce s-a cerut din buton
        if: always()
        env:
          PANEL_URL: ${{ secrets.PANEL_URL }}
          CRON_KEY: ${{ secrets.CRON_KEY }}
          DOAR_COADA: "1"
        run: python generate_draft.py
